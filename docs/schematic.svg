  <circle class="pin" cx="680" cy="210" r="18" />
  <text class="pin-text" x="720" y="215">GND</text>
  <circle class="pin" cx="760" cy="150" r="18" />
  <text class="pin-text" x="800" y="155">SDA</text>
  <circle class="pin" cx="760" cy="210" r="18" />
  <text class="pin-text" x="800" y="215">SCL</text>

  <circle class="pin" cx="680" cy="420" r="18" />
  <text class="pin-text" x="720" y="425">VCC</text>
  <circle class="pin" cx="680" cy="470" r="18" />
