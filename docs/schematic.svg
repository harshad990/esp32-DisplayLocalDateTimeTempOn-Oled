  <path class="b" d="M182 260 C 280 260, 620 210, 680 210" />
  <text class="label" x="420" y="240" text-anchor="middle">GND</text>
  <path class="b" d="M182 360 C 420 360, 740 160, 760 150" />
  <text class="label" x="520" y="340" text-anchor="middle">SDA</text>
  <path class="b" d="M182 460 C 420 460, 740 210, 760 210" />
  <text class="label" x="520" y="420" text-anchor="middle">SCL</text>
  <path class="b" d="M182 560 C 420 560, 740 445, 760 445" />
  <text class="label" x="520" y="520" text-anchor="middle">Vout</text>

  <path class="b" d="M640 420 C 640 520, 520 520, 520 520" />
