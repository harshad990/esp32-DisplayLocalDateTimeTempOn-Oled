<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .b { fill:none; stroke:#333; stroke-width:4px; }
    .t { font:24px Arial, Helvetica, sans-serif; fill:#111; }
    .label { font:20px Arial, Helvetica, sans-serif; fill:#111; }
    .box { fill:#f5f5f5; stroke:#333; stroke-width:3px; }
    .pin { fill:#fff; stroke:#333; stroke-width:2px; }
    .pin-text { font:18px Arial, Helvetica, sans-serif; fill:#111; }
  </style>

  <rect class="box" x="40" y="40" width="360" height="620" rx="24" />
  <text class="t" x="220" y="80" text-anchor="middle">ESP32</text>
  <rect class="box" x="600" y="40" width="320" height="250" rx="20" />
  <text class="t" x="760" y="80" text-anchor="middle">SSD1306 OLED</text>
  <rect class="box" x="600" y="360" width="320" height="250" rx="20" />
  <text class="t" x="760" y="400" text-anchor="middle">LM35 Sensor</text>

  <circle class="pin" cx="160" cy="160" r="18" />
  <text class="pin-text" x="210" y="165">3.3V</text>
  <circle class="pin" cx="160" cy="260" r="18" />
  <text class="pin-text" x="210" y="265">GND</text>
  <circle class="pin" cx="160" cy="360" r="18" />
  <text class="pin-text" x="210" y="365">GPIO21 (SDA)</text>
  <circle class="pin" cx="160" cy="460" r="18" />
